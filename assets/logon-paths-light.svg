<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Winlogon Lab: CPs, PLAP and EoA converge on a native file dialog">
 <title>Winlogon Lab — three entry points, one file dialog</title>
 <g font-family="Consolas,DejaVu Sans Mono,monospace" text-anchor="middle">
 <text x="450" y="24" fill="#655E72" font-size="13" letter-spacing="2">[ WINDOWS SIGN-IN ENVIRONMENT ]</text>
 <path d="M150 48 V62 M450 48 V62 M750 48 V62" stroke="#C9BDD9" stroke-width="2" stroke-dasharray="4 5"/>
 <rect x="30" y="63" width="240" height="52" rx="12" fill="#F3B8C8"/><text x="150" y="86" font-size="17" font-weight="bold" fill="#41394F">CPs</text><text x="150" y="103" font-size="11" fill="#41394F">Command link</text>
 <rect x="330" y="63" width="240" height="52" rx="12" fill="#BBA9E8"/><text x="450" y="86" font-size="17" font-weight="bold" fill="#302842">PLAP</text><text x="450" y="103" font-size="11" fill="#302842">Connect</text>
 <rect x="630" y="63" width="240" height="52" rx="12" fill="#A9D8E8"/><text x="750" y="86" font-size="17" font-weight="bold" fill="#304B56">EoA</text><text x="750" y="103" font-size="11" fill="#304B56">Ctrl+Alt+F9</text>
 <path d="M150 115 V130 H450 M750 115 V130 H450 M450 115 V144" fill="none" stroke="#C9BDD9" stroke-width="2"/>
 <rect x="287" y="145" width="326" height="37" rx="12" fill="#B9DCC5"/><text x="450" y="168" font-size="15" font-weight="bold" fill="#314D3B">NATIVE OPEN FILE DIALOG</text>
 </g></svg>